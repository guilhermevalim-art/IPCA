services:
  - type: web
    name: controle-pj-ipca
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk: {name: dados, mountPath: /var/data, sizeGB: 1}
    envVars:
      - {key: DATA_DIR, value: /var/data}
      - {key: SESSION_SECRET, generateValue: true}
