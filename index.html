<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de PJ - IPCA</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5FA;--card:#fff;--tx:#0F1E33;--mu:#64748B;--bd:#E2E8F0;--navy:#0A1B33;--blue:#17406F;--gold:#E4B948;--ok:#16A34A;--okb:#DCFCE7;--wn:#CA8A04;--wnb:#FEF3C7;--bad:#DC2626;--badb:#FEE2E2;--in:#F8FAFC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08121F;--card:#102038;--tx:#EAF0F9;--mu:#93A4BC;--bd:#1E3350;--okb:#12382A;--wnb:#3B3210;--badb:#3F1818;--in:#0B1829;--ok:#4ADE80;--wn:#FBBF24;--bad:#F87171}}
:root[data-theme="dark"]{--bg:#08121F;--card:#102038;--tx:#EAF0F9;--mu:#93A4BC;--bd:#1E3350;--okb:#12382A;--wnb:#3B3210;--badb:#3F1818;--in:#0B1829;--ok:#4ADE80;--wn:#FBBF24;--bad:#F87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 'Plus Jakarta Sans',system-ui,Segoe UI,sans-serif;display:flex;min-height:100vh}
aside{width:262px;background:var(--navy);color:#fff;padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px;padding:0 10px 4px}.logo b{color:var(--gold)}.sub{font-size:11px;color:#8FA3BF;padding:0 10px 18px}
.mn{font-size:11px;letter-spacing:.14em;color:#8FA3BF;font-weight:800;padding:0 10px 8px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:700;color:#E6EDF7;position:relative}
nav button i{font-style:normal;width:34px;height:34px;border-radius:10px;background:#12294A;display:grid;place-items:center;color:var(--gold);font-size:15px}
nav button:hover{background:#10294B}nav button.on{background:linear-gradient(90deg,#1B4170,#143258);box-shadow:inset 3px 0 0 var(--gold)}
nav .bd{margin-left:auto;background:var(--gold);color:#0A1B33;border-radius:99px;font-size:12px;padding:2px 9px;font-weight:800}
.sp{flex:1}.th{all:unset;cursor:pointer;text-align:center;padding:10px;border:1px solid #234470;border-radius:12px;color:#C9D6E8;font-weight:700}
main{flex:1;min-width:0;padding:28px 32px 60px}
h1{margin:0 0 4px;font-size:26px;font-weight:800}.lead{color:var(--mu);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.k{border-radius:18px;padding:18px;border:1px solid var(--bd);background:var(--card);border-left:6px solid var(--gold)}.k b{font-size:32px;display:block;line-height:1.1}.k span{color:var(--mu);font-weight:600}
.k.ok{border-left-color:var(--ok);background:var(--okb)}.k.wn{border-left-color:var(--wn);background:var(--wnb)}.k.bad{border-left-color:var(--bad);background:var(--badb)}
.bar{height:14px;border-radius:99px;background:var(--bd);overflow:hidden;display:flex}.bar i{display:block;height:100%}
table{width:100%;border-collapse:separate;border-spacing:0 6px}th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:4px 12px}
td{padding:11px 12px;background:var(--in);vertical-align:middle}td:first-child{border-radius:12px 0 0 12px}td:last-child{border-radius:0 12px 12px 0}
td small{display:block;color:var(--mu);font-size:12px}.num{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.ok td{background:var(--okb)}tr.ok td:first-child{box-shadow:inset 5px 0 0 var(--ok)}tr.wn td{background:var(--wnb)}tr.wn td:first-child{box-shadow:inset 5px 0 0 var(--wn)}tr.bad td{background:var(--badb)}tr.bad td:first-child{box-shadow:inset 5px 0 0 var(--bad)}
.wrap{overflow-x:auto}
select,input,button.b{font:inherit;color:var(--tx)}
select.st{border:0;border-radius:99px;padding:7px 12px;font-weight:800;cursor:pointer}
select.st.ok,.pill.ok{background:var(--ok);color:#fff}select.st.wn,.pill.wn{background:var(--gold);color:#3B2A00}select.st.bad,.pill.bad{background:var(--bad);color:#fff}
select.st option{background:#fff;color:#111}
.pill{border-radius:99px;padding:4px 11px;font-weight:800;font-size:12px;white-space:nowrap}
input.f,select.f{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;background:var(--in)}
input.idx{width:86px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--card);text-align:right}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:5px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
button.b{border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff}button.b.gd{background:var(--gold);color:#0A1B33}button.b.gh{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.big{font-size:30px;font-weight:800;color:var(--ok)}
.drop{border:2px dashed var(--gold);border-radius:18px;padding:30px;text-align:center;cursor:pointer;background:var(--in)}.drop.ov{background:var(--wnb)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;border-left:5px solid var(--gold);z-index:9;display:none;max-width:340px}
.mb{display:flex;align-items:flex-end;gap:6px;height:110px}.mb div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.mb i{display:block;background:var(--gold);border-radius:6px 6px 0 0;margin-bottom:4px;min-height:2px}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.top input{flex:1;min-width:200px}
tr.bh td{background:var(--navy);color:#fff;padding:12px 14px;border-radius:12px;box-shadow:inset 5px 0 0 var(--gold)}tr.bh .pill{margin:0 4px}
body.out aside,body.out main{display:none}aside{overflow-y:auto}
#auth{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#17406F,#0A1B33 70%);padding:20px}#auth.on{display:flex}
.ac{background:var(--card);color:var(--tx);border-radius:22px;padding:30px;width:100%;max-width:400px;border-top:5px solid var(--gold);max-height:100%;overflow:auto}.ac .logo{padding:0}.ac .th{display:block;margin-top:6px}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px}.logo,.sub,.mn,.sp{display:none}nav{display:flex;flex-wrap:wrap;gap:4px}nav button i{display:none}main{padding:18px 14px}}
main.fit{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:16px 28px}
main.fit h1{font-size:22px}main.fit .lead{margin:0 0 10px}main.fit .kpis{margin-bottom:10px;gap:10px}main.fit .k{padding:12px 16px}main.fit .k b{font-size:26px}
main.fit .card{margin-bottom:10px;padding:14px 16px}main.fit .g{flex:1;min-height:0;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:10px}
main.fit .g .card{margin:0;overflow:auto;min-height:0}main.fit .mb{height:clamp(60px,14vh,110px)}
@media(max-width:820px){main.fit{height:auto;overflow:visible;padding:18px 14px}main.fit .g{grid-template-columns:1fr;grid-template-rows:none}}
</style>
</head>

const rnd=()=>{const a=new Uint8Array(16);(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256);return[...a].map(b=>b.toString(16).padStart(2,'0')).join('')};
async function hh(pw,salt){const e=new TextEncoder();if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:e.encode(salt),iterations:150000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;const t=salt+pw;for(let i=0;i<t.length*60;i++)h=((h<<5)+h+t.charCodeAt(i%t.length))|0;return'x'+h}

let NS=false,es=null,pt=0;
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});let j={};try{j=await r.json()}catch(e){}

async function chPw(){const n=$('#c_n').value;if(!okP(n))return toast('A nova senha precisa ter ao menos 4 caracteres.');if(n!=$('#c_n2').value)return toast('As senhas não conferem.');try{await api('POST','/api/password',{a:$('#c_a').value,n});render();toast('Senha alterada.')}catch(x){toast(x.message)}}
function logout(){api('POST','/api/logout').catch(()=>{});me=null;FX=null;if(es)es.close();try{sessionStorage.removeItem(SK)}catch(e){}showAuth()}
(async()=>{S={ps:[],ipca:{},log:[]};try{const st=await api('GET','/api/me');NS=st.needSetup;if(st.me){if(st.me.mustChange){FX=st.me;return showForce(st.me)}return go(st.me)}}catch(e){}showAuth()})();
